<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ ui.language_title }} — SocraticTutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #f5f3ef;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      background: white;
      max-width: 680px;
      width: 100%;
      padding: 3rem;
      border: 1px solid #ddd;
    }
    h1 { font-size: 1.5rem; font-weight: normal; margin-bottom: 0.75rem; }
    p { font-size: 0.95rem; color: #555; margin-bottom: 2rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 0.5rem; color: #333; }
    select {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1px solid #ccc;
      background: white;
      font-size: 0.95rem;
      font-family: Georgia, serif;
      color: #1a1a1a;
      margin-bottom: 1.5rem;
    }
    select:focus { outline: 2px solid #1a1a1a; border-color: #1a1a1a; }
    button {
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 0.85rem 2.5rem;
      font-size: 0.9rem;
      font-family: monospace;
      letter-spacing: 0.05em;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #333; }
    @media (max-width: 640px) {
      body { padding: 1rem; }
      .container { padding: 1.25rem; max-width: 100%; }
      h1 { font-size: 1.25rem; }
      p { font-size: 0.9rem; margin-bottom: 1.25rem; }
      select, button { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{ ui.language_title }}</h1>
    <p>{{ ui.language_subtitle }}</p>
    <form method="POST" action="/language">
      <label for="language">{{ ui.language_label }}</label>
      <select id="language" name="language">
        <option value="pt" {% if lang == "pt" %}selected{% endif %}>{{ ui.language_portuguese }}</option>
        <option value="en" {% if lang == "en" %}selected{% endif %}>{{ ui.language_english }}</option>
        <option value="es" {% if lang == "es" %}selected{% endif %}>{{ ui.language_spanish }}</option>
      </select>
      <button type="submit">{{ ui.language_continue }}</button>
    </form>
  </div>
</body>
</html>
