<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ ui.session_stage }} — SocraticTutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #f5f3ef;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      background: white;
      max-width: 720px;
      width: 100%;
      height: 90vh;
      border: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title { font-size: 0.9rem; color: #333; }
    .header-label { font-family: monospace; font-size: 0.75rem; color: #aaa; letter-spacing: 0.08em; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .message { display: flex; flex-direction: column; gap: 0.3rem; max-width: 85%; }
    .message.tutor { align-self: flex-start; }
    .message.user { align-self: flex-end; }
    .message-role { font-family: monospace; font-size: 0.7rem; color: #aaa; letter-spacing: 0.08em; text-transform: uppercase; }
    .message.user .message-role { text-align: right; }
    .message-bubble { padding: 0.85rem 1.1rem; font-size: 0.92rem; line-height: 1.65; }
    .message.tutor .message-bubble { background: #f5f3ef; border: 1px solid #e8e4dd; }
    .message.user .message-bubble { background: #1a1a1a; color: white; }
    .input-area {
      padding: 1.25rem 1.75rem;
      border-top: 1px solid #eee;
      display: flex;
      gap: 0.75rem;
    }
    textarea {
      flex: 1;
      resize: none;
      border: 1px solid #ccc;
      padding: 0.65rem 0.9rem;
      font-size: 0.9rem;
      font-family: Georgia, serif;
      line-height: 1.5;
      height: 60px;
      color: #1a1a1a;
    }
    textarea:focus { outline: 2px solid #1a1a1a; border-color: #1a1a1a; }
    textarea:disabled { background: #f9f9f9; color: #aaa; }
    button {
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 0 1.5rem;
      font-family: monospace;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #333; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .done-banner {
      background: #f0f7f0;
      border-top: 1px solid #c3dfc3;
      padding: 1rem 1.75rem;
      font-size: 0.88rem;
      color: #2d5a2d;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .done-banner a {
      background: #2d5a2d;
      color: white;
      padding: 0.5rem 1.25rem;
      text-decoration: none;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      body { padding: 0.5rem; height: auto; min-height: 100vh; justify-content: flex-start; }
      .container { max-width: 100%; height: calc(100vh - 1rem); border-radius: 8px; overflow: hidden; }
      .header { padding: 0.85rem 1rem; }
      .header-title { font-size: 0.82rem; }
      .header-label { display: none; }
      .messages { padding: 1rem; gap: 0.85rem; }
      .message { max-width: 92%; }
      .message-bubble { padding: 0.72rem 0.82rem; font-size: 0.86rem; line-height: 1.45; }
      .input-area { padding: 0.75rem; gap: 0.5rem; align-items: flex-end; }
      textarea { height: 52px; min-height: 52px; font-size: 0.88rem; padding: 0.55rem 0.7rem; }
      button { padding: 0 0.95rem; height: 52px; font-size: 0.74rem; }
      .done-banner { flex-direction: column; align-items: flex-start; font-size: 0.8rem; padding: 0.75rem; }
      .done-banner a { padding: 0.45rem 0.9rem; font-size: 0.74rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="header-title">{{ ui.session_title }}</span>
      <span class="header-label">{{ ui.session_stage }}</span>
    </div>

    <div class="messages" id="messages">
      {% for msg in chat_messages %}
      <div class="message {{ msg.role }}">
        <span class="message-role">{% if msg.role == "tutor" %}Tutor{% else %}{{ ui.session_you }}{% endif %}</span>
        <div class="message-bubble">{{ msg.content }}</div>
      </div>
      {% endfor %}
    </div>

    <div class="done-banner" id="done-banner">
      <span>{{ ui.session_done }}</span>
      <a href="/evaluation">{{ ui.session_done_cta }}</a>
    </div>

    <div class="input-area">
      <textarea id="user-input" placeholder="{{ ui.session_placeholder }}" onkeydown="handleKey(event)"></textarea>
      <button onclick="sendMessage()" id="send-btn">{{ ui.session_send }}</button>
    </div>
  </div>

  <script>
    const userLabel = "{{ ui.session_you }}";
    const refreshBlockedMessage = "{{ ui.session_refresh_blocked }}";
    const leaveWarningMessage = "{{ ui.session_leave_warning }}";
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const doneBanner = document.getElementById("done-banner");
    let sending = false;

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function appendMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      const roleLabel = document.createElement("span");
      roleLabel.className = "message-role";
      roleLabel.textContent = role === "tutor" ? "Tutor" : userLabel;

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.textContent = text;

      wrapper.appendChild(roleLabel);
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      if (sending) return;
      const text = inputEl.value.trim();
      if (!text) return;
      sending = true;

      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      appendMessage("user", text);

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      const data = await response.json();
      appendMessage("tutor", data.reply);

      if (data.done) {
        doneBanner.style.display = "flex";
      } else {
        sending = false;
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "F5" || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "r")) {
        event.preventDefault();
        alert(refreshBlockedMessage);
      }
    });

    window.addEventListener("beforeunload", (event) => {
      event.preventDefault();
      event.returnValue = leaveWarningMessage;
    });
  </script>
</body>
</html>
