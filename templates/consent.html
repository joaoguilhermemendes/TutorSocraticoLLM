<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ ui.consent_title }} — SocraticTutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #f5f3ef;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      background: white;
      max-width: 680px;
      width: 100%;
      padding: 3rem;
      border: 1px solid #ddd;
    }
    .label {
      font-family: monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: normal;
      margin-bottom: 2rem;
      line-height: 1.4;
    }
    .body-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #333;
      margin-bottom: 1.5rem;
    }
    .body-text p { margin-bottom: 1rem; }
    hr { border: none; border-top: 1px solid #eee; margin: 2rem 0; }
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .checkbox-row input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .checkbox-row label { font-size: 0.9rem; line-height: 1.6; color: #333; }
    button {
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 0.85rem 2.5rem;
      font-size: 0.9rem;
      font-family: monospace;
      letter-spacing: 0.05em;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #333; }
    @media (max-width: 640px) {
      body { padding: 1rem; align-items: flex-start; }
      .container { max-width: 100%; padding: 1.25rem; }
      .label { margin-bottom: 1rem; font-size: 0.68rem; }
      h1 { font-size: 1.2rem; margin-bottom: 1rem; }
      .body-text { font-size: 0.9rem; line-height: 1.6; }
      .checkbox-row label { font-size: 0.86rem; line-height: 1.45; }
      button { padding: 0.8rem 1rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">{{ ui.consent_label }}</div>
    <h1>{{ ui.consent_title }}</h1>

    <div class="body-text">
      <p>{{ ui.consent_p1 }}</p>
      <p>{{ ui.consent_p2 }}</p>
      <p>{{ ui.consent_p3 }}</p>
      <p>{{ ui.consent_p4 }}</p>
      <p>{{ ui.consent_p5 }}</p>
    </div>

    <hr>

    <form method="POST" action="/consent">
      <input type="hidden" name="consent" value="yes">
      <div class="checkbox-row">
        <input type="checkbox" id="agree" onchange="document.getElementById('btn').disabled = !this.checked">
        <label for="agree">
          {{ ui.consent_agree }}
        </label>
      </div>
      <button type="submit" id="btn" disabled>{{ ui.consent_button }}</button>
    </form>
  </div>
</body>
</html>
